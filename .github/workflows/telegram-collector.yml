name: Telegram Collector Worker

on:
  # Ejecutar cada 20 minutos (evita colisiones con cron de 15/30 min de otros)
  schedule:
    - cron: "*/20 * * * *"

  # Permitir ejecución manual
  workflow_dispatch:

  # Ejecutar en push a main (para probar cambios)
  push:
    branches: [main]
    paths:
      - "workers/telegram-collector/**"

# Evitar ejecuciones concurrentes (importante para last_cursor)
concurrency:
  group: telegram-collector
  cancel-in-progress: false

jobs:
  telegram-collector:
    name: Ejecutar Worker de Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # No necesitamos permisos adicionales

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "workers/telegram-collector/requirements.txt"

      - name: Install dependencies
        working-directory: workers/telegram-collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          # Nombre legacy aceptado por compatibilidad con la documentación antigua
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}
        run: |
          python -c "
          import os
          legacy_session = os.environ.get('TELEGRAM_SESSION_STRING', '').strip()
          if not os.environ.get('TELEGRAM_STRING_SESSION', '').strip() and legacy_session:
              print('Aviso: TELEGRAM_STRING_SESSION no está definido; se usará el nombre legacy TELEGRAM_SESSION_STRING')
          required = ['TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'INGEST_API_URL', 'INGEST_HMAC_SECRET']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if not os.environ.get('TELEGRAM_STRING_SESSION', '').strip() and not legacy_session:
              missing.append('TELEGRAM_STRING_SESSION')
          if missing:
              print('::error::Faltan secrets en el repositorio: ' + ', '.join(missing))
              print('Configúralos en Settings > Secrets and variables > Actions (Repository secrets).')
              raise SystemExit(1)
          print('Todos los secrets requeridos están presentes.')
          "

      - name: Verify Telethon session
        working-directory: workers/telegram-collector
        env:
          # El secreto se pasa por entorno, nunca se interpola dentro del script
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION || secrets.TELEGRAM_SESSION_STRING }}
        run: |
          python -c "
          import os
          import sys
          from telethon.sessions import StringSession

          raw = os.environ.get('TELEGRAM_STRING_SESSION', '').strip()
          print(f'Longitud de la cadena de sesión recibida: {len(raw)} caracteres')

          if not raw:
              print('::error::El secreto TELEGRAM_STRING_SESSION está vacío o no existe')
              print('Genera la cadena con workers/telegram-collector/generate_session.py y guárdala como Repository secret.')
              sys.exit(1)

          try:
              session = StringSession(raw)
          except ValueError as exc:
              print(f'::error::La cadena no es una StringSession válida de Telethon: {exc}')
              sys.exit(1)

          print('Session valid:', session.auth_key is not None)
          print('Data center:', session.dc_id)
          if session.auth_key is None:
              print('::error::La cadena de sesión no contiene una auth_key utilizable')
              sys.exit(1)
          "

      - name: Run Telegram Collector
        working-directory: workers/telegram-collector
        env:
          # Telegram API (obtener en https://my.telegram.org)
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION || secrets.TELEGRAM_SESSION_STRING }}

          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: external-imports

          # API de ingesta
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_HMAC_SECRET: ${{ secrets.INGEST_HMAC_SECRET }}

          # Opcionales (tienen defaults)
          MAX_IMAGE_SIZE_BYTES: ${{ secrets.MAX_IMAGE_SIZE_BYTES }}
          MAX_CONSECUTIVE_ERRORS: ${{ secrets.MAX_CONSECUTIVE_ERRORS }}
          LOG_LEVEL: INFO
        run: |
          # tee: deja la salida en worker.log para subirla como artefacto
          # pipefail: el step falla si falla el worker, no solo el tee
          set -o pipefail
          python -m main 2>&1 | tee worker.log

      - name: Upload logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-collector-logs
          path: workers/telegram-collector/worker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on repeated failures
        if: failure()
        run: |
          echo "::warning::Telegram Collector failed. Check workflow logs."
          # Opcional: integrar con Slack, Discord, email via secrets
