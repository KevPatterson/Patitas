    <script type="application/ld+json">

        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://patitass.vercel.app/#organization",
            "name": "Patitas",
            "url": "https://patitass.vercel.app/",

              "@type": "Country",
              "name": "Cuba"
            },
            "knowsLanguage": "es-CU"
          },

            "@id": "https://patitass.vercel.app/#website",

              },

            }

    <noscript>
      <div>

        </p>

        </p>
