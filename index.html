<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color-meta" content="#ff8c42" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Patitas · Que ninguna patita se quede sin casa</title>
    <meta
      name="description"
      content="Patitas es una plataforma comunitaria para reencontrar mascotas perdidas, reportar encontradas y promover adopciones responsables. Que ninguna patita se quede sin casa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Patitas · Que ninguna patita se quede sin casa" />
    <meta
      property="og:description"
      content="Plataforma comunitaria para reencontrar mascotas perdidas, reportar encontradas y promover adopciones responsables."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Patitas · Que ninguna patita se quede sin casa" />
    <meta
      name="twitter:description"
      content="Plataforma comunitaria para reencontrar mascotas perdidas, reportar encontradas y promover adopciones responsables."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      (function () {
        var storageKey = 'patitas-theme';
        var theme = localStorage.getItem(storageKey);
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = theme === 'dark' || (!theme && prefersDark);
        document.documentElement.classList.toggle('dark', isDark);
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', isDark ? '#1c0e05' : '#ff8c42');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
